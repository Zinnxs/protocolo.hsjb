<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Recibos Pro">
    <link rel="apple-touch-icon" href="icon.png">

    <title>Gerador de Recibos Corporativo</title>
    
    <style>
        /* --- ESTILO GERAL --- */
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #2980b9;
            --bg: #ecf0f1;
            --border-radius: 12px;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            display: flex;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 380px;
            background-color: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
        }

        .header {
            padding: 20px;
            background: var(--primary);
            color: white;
        }
        .header h1 { margin: 0; font-size: 18px; }
        .header p { margin: 5px 0 0; font-size: 12px; opacity: 0.8; }

        .form-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .card-input {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
        
        input, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 50px; }

        .btn-action {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .btn-print {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-print:hover { background-color: #1c5980; }

        /* --- PREVIEW --- */
        .preview-container {
            flex: 1;
            background-color: #525659;
            display: flex;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
        }

        .folha-a4 {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 10mm 15mm;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espaço entre recibos */
            box-sizing: border-box;
        }

        /* --- RECIBO --- */
        .recibo {
            border: 2px solid #000;
            border-radius: 10px;
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .recibo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 8px;
        }

        .label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #333;
        }

        .dados {
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: 600;
            color: #000;
            border-bottom: 1px solid #999;
            min-height: 20px;
            padding-left: 5px;
            white-space: nowrap; 
            overflow: hidden;
        }

        .disc-container {
            flex: 1;
            position: relative;
            margin-top: 5px;
        }

        .pauta-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(#999 1px, transparent 1px);
            background-size: 100% 26px;
            margin-top: 25px;
        }

        .disc-texto {
            position: relative;
            z-index: 2;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            line-height: 26px;
            width: 100%;
            word-break: break-all;
            white-space: pre-wrap;
        }

        /* MOBILE */
        @media (max-width: 800px) {
            body { flex-direction: column; overflow: auto; }
            .sidebar { width: 100%; border-right: none; box-shadow: none; }
            .preview-container { display: none; }
            .btn-action { position: fixed; bottom: 0; left: 0; right: 0; z-index: 99; }
            .form-content { padding-bottom: 80px; }
        }

        /* PRINT */
        @media print {
            @page { margin: 0; size: A4; }
            body { display: block; height: auto; overflow: visible; background: white; }
            .sidebar, .btn-action { display: none !important; }
            .preview-container { padding: 0; background: none; display: block; overflow: visible; height: auto; }
            .folha-a4 { width: 100%; height: 100vh; margin: 0; padding: 10mm; box-shadow: none; }
            .recibo { page-break-inside: avoid; border: 2px solid #000; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="header">
            <h1>📄 Emissor de Recibos</h1>
            <p>Preencha os dados abaixo</p>
        </div>
        <div class="form-content" id="formContainer"></div>
        <div class="btn-action">
            <button class="btn-print" onclick="window.print()">🖨️ GERAR PDF</button>
        </div>
    </aside>

    <main class="preview-container">
        <div class="folha-a4" id="folhaA4"></div>
    </main>

    <script>
        // --- Registro do Service Worker para PWA ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado!', reg))
                    .catch(err => console.log('Erro ao registrar SW:', err));
            });
        }

        // --- Lógica do App ---
        const totalRecibos = 5;

        function init() {
            const formContainer = document.getElementById('formContainer');
            const folhaA4 = document.getElementById('folhaA4');

            for (let i = 1; i <= totalRecibos; i++) {
                // INPUTS
                formContainer.insertAdjacentHTML('beforeend', `
                    <div class="card-input">
                        <div class="card-title">Recibo #${i}</div>
                        <div class="input-row">
                            <div style="flex:3"><label class="label">Destinatário</label><input type="text" oninput="upd(${i}, 'dest', this.value)"></div>
                            <div style="flex:1"><label class="label">Nº</label><input type="text" oninput="upd(${i}, 'num', this.value)"></div>
                        </div>
                        <div><label class="label">Discriminação</label><textarea oninput="upd(${i}, 'disc', this.value)"></textarea></div>
                    </div>
                `);

                // PREVIEW
                folhaA4.insertAdjacentHTML('beforeend', `
                    <div class="recibo">
                        <div class="recibo-header">
                            <div style="width: 70%;"><span class="label">Destinatário</span><div class="dados" id="v-dest-${i}"></div></div>
                            <div style="width: 25%;"><span class="label">Nº</span><div class="dados" id="v-num-${i}"></div></div>
                        </div>
                        <span class="label" style="margin-top:5px; border-bottom:1px solid #000;">Discriminação</span>
                        <div class="disc-container">
                            <div class="pauta-bg"></div>
                            <div class="disc-texto" id="v-disc-${i}"></div>
                        </div>
                    </div>
                `);
            }
        }

        function upd(i, type, val) {
            document.getElementById(`v-${type}-${i}`).innerText = val;
        }

        init();
    </script>
</body>
</html>
